# Render blueprint for HashShelf.
#
# Free plan notes:
#  - The service spins down after ~15 min idle (30-60s cold start). The client
#    falls back to calling OpenLibrary directly while the API is cold, so the
#    app still works — upgrade plan to "starter" to keep it always-on.
#  - The filesystem is ephemeral on the free plan: the SQLite cache rebuilds
#    itself (fine), but SHORT LINKS DO NOT SURVIVE deploys/restarts without a
#    disk. Before sharing short links for real, either attach the disk below
#    (requires a paid instance) or point HASHSHELF_DB at durable storage.
services:
  - type: web
    name: hashshelf
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Single worker: keeps the OpenLibrary token bucket + in-flight dedupe
    # global (they are per-process) and gives SQLite a single writer process.
    # Scale with threads, not workers, unless the DB moves off SQLite.
    startCommand: gunicorn -w 1 --threads 16 --timeout 60 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /healthz
    envVars:
      - key: HASHSHELF_CONTACT
        value: https://hashshelf.com
    # Uncomment for durable SQLite (paid instance required), and set
    # HASHSHELF_DB=/var/data/hashshelf.db in envVars above:
    # disk:
    #   name: hashshelf-data
    #   mountPath: /var/data
    #   sizeGB: 1
