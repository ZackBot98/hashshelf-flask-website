# Render blueprint for HashShelf.
#
# Paid setup (Starter + 1GB disk, ~$7.25/mo): always-on (no cold starts), and
# the SQLite database lives on the persistent disk, which is what makes short
# links and the OpenLibrary cache survive deploys and restarts.
#
# Note: an attached disk disables zero-downtime deploys — each deploy has a
# few seconds of restart blip. Acceptable at this scale.
services:
  - type: web
    name: hashshelf
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Single worker: keeps the OpenLibrary token bucket + in-flight dedupe
    # global (they are per-process) and gives SQLite a single writer process.
    # Scale with threads, not workers, unless the DB moves off SQLite.
    startCommand: gunicorn -w 1 --threads 16 --timeout 60 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /healthz
    envVars:
      - key: HASHSHELF_CONTACT
        value: https://hashshelf.com
      - key: HASHSHELF_DB
        value: /var/data/hashshelf.db
    disk:
      name: hashshelf-data
      mountPath: /var/data
      sizeGB: 1
